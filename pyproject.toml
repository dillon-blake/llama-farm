[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "learning-llamas"
description = "Train LoRA adapters (SFT/DPO/GRPO) on frozen, quantized GGUF models via llama.cpp's ggml backend."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dillon Blake" }]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "pre-commit>=3", "build>=1"]

[project.urls]
Homepage = "https://github.com/dillon-blake/llama-farm"

# ---------------------------------------------------------------------------
# scikit-build-core: CMake drives the native build (vendored llama.cpp CPU +
# the liblearningllamas shim); the Python package ships from src/.
#
# Only the `learningllamas` install component is packaged. llama.cpp's own
# install rules -- headers, CMake config, pkgconfig -- use the default
# component and are therefore excluded, which keeps the wheel to exactly the
# five shared libraries the loader opens.
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/learning_llamas"]
install.components = ["learningllamas"]

[tool.scikit-build.metadata.version]
# Single source of truth for the version: src/learning_llamas/__init__.py.
provider = "scikit_build_core.metadata.regex"
input = "src/learning_llamas/__init__.py"

# ---------------------------------------------------------------------------
# pytest. The per-PR CI selection is `-m "not slow"` with the backend markers
# deselected; the nightly lane runs everything (S0-07).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "slow: nightly-only (convergence gates, full sweeps)",
    "cuda: requires a CUDA backend build",
    "metal: requires a Metal backend build",
    "vulkan: requires a Vulkan backend build",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (Google convention, see below)
]
ignore = [
    "D107",  # __init__ is documented in the class docstring
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; module/function docstrings are
# still encouraged but not enforced.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
