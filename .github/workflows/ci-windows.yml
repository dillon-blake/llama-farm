# Windows / MSVC (S1-33).
#
# A separate workflow from ci-cpu, not a matrix entry on it, and the reason is that almost nothing
# is shared: a different compiler, a different linker, a different DLL search model, a different
# cache tool. Folding it into the Linux/macOS matrix would mean an `if: runner.os == 'Windows'` on
# every step, which is a matrix in a trench coat.
#
# Two tiers, mirroring ci-cpu (S0-07): a quick per-PR lane, and a fuller nightly one.

name: ci-windows

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  # Keyed on the EVENT as well as the ref. A schedule run and a push to main both resolve to
  # refs/heads/main, so a single group let a push landing inside the 04:00 window cancel the
  # nightly -- and the nightly is the only place the full pytest suite, the full forward sweep and
  # the MUL_MAT grad run at all -- or let the nightly cancel a push run a required check is
  # waiting on.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Supersede only where a newer run genuinely replaces an older one: another push to the same
  # branch or PR. A nightly and a manual dispatch are each the only run of their tier, so
  # cancelling one loses the coverage rather than saving a runner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    name: build + test (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sccache, not ccache: ccache's MSVC support is experimental and its cache-miss behaviour on
      # Windows is its own adventure. sccache is what Mozilla built for exactly this.
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: install
        # bash, for the same reason the `ops` job below sets it as a job default: on Windows the
        # default shell is pwsh, which propagates only the LAST native command's exit code, so in a
        # four-command step the first three can fail and the step still goes green. Here that would
        # mean an unbuilt extension surviving into the pytest steps as a confusing import error.
        # GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail`, so the FIRST failure
        # ends the step.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # --no-build-isolation means the build backend must already be here: pip will not fetch it.
          python -m pip install scikit-build-core cmake ninja pytest ruff build
          python -m pip install -e . --no-build-isolation
          # gguf-py comes from the vendored tree, never PyPI: the pinned llama.cpp commit, gguf-py,
          # and the _ffi struct mirrors are one atomic version (ADR-0001).
          python -m pip install -e vendor/llama.cpp/gguf-py
        env:
          # GGML_NATIVE=OFF for a reproducible build: with it on, ggml compiles for whatever the
          # runner happens to be, and a cached object from one runner generation crashes on another.
          # /utf-8 because MSVC otherwise reads the sources as the system codepage, and this codebase
          # has UTF-8 in its comments.
          CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          SCCACHE_GHA_ENABLED: "true"

      # The load order and the DLL search path are the two things that are genuinely different on
      # Windows, and both fail at import rather than at build. Check them before anything else, so a
      # failure here is unambiguous.
      - name: import (the DLL search path is the thing under test)
        run: python -c "from learning_llamas import _ffi; libs = _ffi.load(); print(libs.farm.ll_version().decode())"

      - name: pytest (per-PR selection)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python -m pytest -q -m "not slow and not cuda and not metal and not vulkan"

      - name: pytest (full, nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pytest -q

      # The Windows twin of ci-cpu's "The wheel installs and imports". Two things this step used to
      # get wrong, both of which made it green on a wheel it had not tested:
      #
      #   * it ran under pwsh, where only the LAST native command's exit code reaches the runner.
      #     `python -m build` could fail, the `pip install` of the wheel could fail, and the step
      #     still reported success because the final `python -c` exited 0;
      #   * the final import could not fail even in principle, because the `install` step above
      #     leaves an EDITABLE install of this package on the interpreter — which resolves
      #     `learning_llamas` out of `src/` no matter what the wheel does or does not contain.
      #     That is the exact hole ci-cpu's comment describes: `_version_lock.py` was missing from
      #     every wheel this project built and no lane noticed.
      #
      # So: bash (fail on the first error), uninstall the editable install FIRST, and then import
      # from a directory that is not the source tree. Installed WITH its dependencies and exercised
      # through the PUBLIC api, matching ci-cpu — `--no-deps` plus a private `_ffi` import proves
      # the shared libraries shipped and nothing about whether a stranger can use the package.
      - name: wheel builds and imports
        shell: bash
        run: |
          python -m build --wheel --no-isolation
          python -m pip uninstall -y learning-llamas
          python -m pip install dist/*.whl
          # mktemp, not $TEMP: this is git-bash, and $RUNNER_TEMP is a backslashed Windows path that
          # `cd` has no business being handed. The directory only has to not be the checkout.
          cd "$(mktemp -d)"
          python -c "
          import learning_llamas
          learning_llamas.libraries()
          print('the wheel imports outside the source tree:', len(learning_llamas.__all__), 'public names')
          "

  # test-backend-ops on MSVC (S1-43). MODE_GRAD coverage of the project's kernel VJPs.
  #
  # The Linux/macOS lanes build and drive the vendored test-backend-ops (ci-cpu `ops`, ci-metal
  # `grad`); this lane never did. So the 18 project-kernel VJPs in tests/project_ops.py had ZERO
  # gradient coverage on MSVC — a genuinely different compiler, whose CPU kernels lean on
  # compiler-sensitive intrinsics — and CI was green (audit 2026-07-15, ci-docs major).
  #
  # This job closes that. It builds the vendored binary with MSVC and drives MODE_GRAD through the
  # SAME pytest wrapper (tests/test_backend_ops_grad.py) the other lanes use, so the ONE op registry
  # and the vacuity guards apply identically: the verdict is parsed, not assumed — a `grad -o <op>`
  # that compares zero gradients is a FAILURE here, not a green "OK". Never an inline op list, never
  # a guessed `-b`. See docs/dev/backward-coverage.md and docs/dev/ci-metal.md.
  #
  # A dedicated job (not more steps on `build`) so it runs in parallel and adds a `ci-windows / ops`
  # check that matches the ci-<backend>/<job> naming the other lanes use.
  ops:
    name: ops
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # -eo pipefail: multi-command steps fail on the FIRST error, not the last.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # The grad wrapper cannot even be COLLECTED without the package: tests/conftest.py imports
      # learning_llamas at module load, and the ggml_device fixture asks the loaded libs for the name
      # ggml actually registered the device under. So install the extension exactly as the build job
      # does — scikit-build-core drives Ninja + MSVC + sccache — with GGML_NATIVE=OFF keeping it an
      # oracle build (the determinism argument in ci-cpu's header).
      - name: Install the package (for the grad wrapper)
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core cmake ninja pytest
          python -m pip install -e . --no-build-isolation
          python -m pip install -e vendor/llama.cpp/gguf-py
        env:
          CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          SCCACHE_GHA_ENABLED: "true"

      # Build the vendored test-backend-ops with MSVC. windows-latest's default generator is the
      # Visual Studio MULTI-CONFIG generator, which changes two things from the Linux recipe:
      #
      #   * the build type is chosen at BUILD time with `--config Release`, because multi-config
      #     generators ignore `-DCMAKE_BUILD_TYPE`;
      #   * the binary lands in bin/RELEASE/, not bin/ — CMake appends the config to
      #     CMAKE_RUNTIME_OUTPUT_DIRECTORY for multi-config generators. TEST_BACKEND_OPS below points
      #     at that exact path, so nothing downstream has to guess the layout.
      #
      # The VS generator locates the MSVC toolchain itself (no vcvars dance), but it does NOT honour
      # CMAKE_<LANG>_COMPILER_LAUNCHER — that is a Ninja/Make feature — so sccache is not wired into
      # this build. GGML_NATIVE=OFF for the same oracle-determinism reason as every other lane.
      - name: Build test-backend-ops (MSVC)
        run: |
          cmake -S vendor/llama.cpp -B build/vendor-tests \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF
          cmake --build build/vendor-tests --config Release --target test-backend-ops -j 2

      # Per-PR, quick tier. A targeted forward subset (a crash-smoke that the MSVC-compiled kernels
      # at least run and self-agree) plus the full MODE_GRAD registry through the wrapper. `-b CPU`
      # is an exact strcmp and CPU is unsuffixed, so — unlike the GPU lanes — it needs no device-name
      # resolution and no `Skipping` guard.
      - name: test-backend-ops — test (targeted, CPU)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: ./build/vendor-tests/bin/Release/test-backend-ops.exe test -b CPU -o MUL_MAT,OUT_PROD,SOFT_MAX,RMS_NORM,CROSS_ENTROPY_LOSS

      # MODE_GRAD through the pytest wrapper — the registry-driven, vacuity-guarded path, identical
      # to the Linux lane. TEST_BACKEND_OPS is the EXACT built path (.exe, under bin/Release/), so
      # _binary() uses it verbatim and never has to guess the multi-config layout.
      - name: test-backend-ops — grad (MODE_GRAD, ops from tests/project_ops.py)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          TEST_BACKEND_OPS: ${{ github.workspace }}/build/vendor-tests/bin/Release/test-backend-ops.exe
          # Deterministic MODE_GRAD draws (S1-50): the SSM scan's FD is the worst-conditioned
          # in the suite, and an unseeded run makes a marginal draw unreproducible.
          GGML_TEST_SEED: "20260716"
        run: python -m pytest tests/test_backend_ops_grad.py -v

      # Nightly, detailed tier — the full forward sweep, the grad wrapper, and MUL_MAT's grad (the
      # only thing that exercises OUT_PROD's gradient path at all; it is nightly-only because it is
      # slow). Mirrors ci-cpu's nightly. Split into one command per step so each exit code is checked.
      - name: test-backend-ops — full forward sweep (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./build/vendor-tests/bin/Release/test-backend-ops.exe test -b CPU

      - name: test-backend-ops — grad wrapper (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TEST_BACKEND_OPS: ${{ github.workspace }}/build/vendor-tests/bin/Release/test-backend-ops.exe
          # Deterministic MODE_GRAD draws (S1-50): the SSM scan's FD is the worst-conditioned
          # in the suite, and an unseeded run makes a marginal draw unreproducible.
          GGML_TEST_SEED: "20260716"
        run: python -m pytest tests/test_backend_ops_grad.py -v

      - name: test-backend-ops — MUL_MAT grad (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./build/vendor-tests/bin/Release/test-backend-ops.exe grad -b CPU -o MUL_MAT
