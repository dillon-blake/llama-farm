# ci-cpu — the always-on tier of the CI matrix (ROADMAP §11).
#
# TWO-TIER PHILOSOPHY. Every backend lane copies this shape:
#
#   per-PR   quick. Build the wheel, run pytest's default selection (-m "not slow"),
#            and run a TARGETED test-backend-ops subset. Budget: under 20 minutes for
#            the slowest matrix entry. Trim the op subset before loosening the budget.
#   nightly  detailed. The full test-backend-ops sweep in both `test` and `grad` modes
#            (no -o filter), plus the full pytest suite including `slow` — which is
#            where the tiny-model convergence gate (S1-12) lives.
#
# CHECK NAMING. Jobs are named so required checks read `ci-cpu / build` and
# `ci-cpu / test`. Later lanes follow `ci-<backend> / <job>` (ci-metal, ci-cuda,
# ci-vulkan), so branch-protection rules stay uniform across backends.
#
# WHY CPU IS NOT JUST A BUILD CHECK. CPU is the correctness ORACLE for the entire kernel
# plan (ROADMAP §4, ADR-0002): every GPU kernel is accepted by matching CPU within
# tolerance. So a green CPU MODE_GRAD run is the baseline that protects every later
# backend ticket, and it runs from day one — before the kernels that will depend on it
# exist.

name: ci-cpu

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: scheduled runs pile up on the hour and
    # get queued.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      record_reference:
        description: "Re-record tests/convergence/reference_curve.json (needs torch + peft; S1-12)"
        type: boolean
        default: false

concurrency:
  # Keyed on the EVENT as well as the ref. A schedule run and a push to main both resolve to
  # refs/heads/main, so a single group let a push landing inside the 04:17 window cancel the
  # nightly -- and the nightly is the only place the `slow` tests, the full test-backend-ops sweep
  # and the MUL_MAT grad run at all -- or let the nightly cancel a push run a required check is
  # waiting on.
  group: ci-cpu-${{ github.event_name }}-${{ github.ref }}
  # Supersede only where a newer run genuinely replaces an older one: another push to the same
  # branch or PR. A nightly and a manual dispatch are each the only run of their tier (and a
  # record-reference dispatch is a different job entirely), so cancelling one loses the coverage
  # rather than saving a runner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # The vendored tree is CPU-only on this lane. On macOS this is load-bearing rather
  # than decorative: GGML_METAL defaults ON for Apple builds
  # (vendor/llama.cpp/ggml/CMakeLists.txt:239), so a macOS build that says nothing about
  # Metal *gets* Metal, and the lane would silently stop being CPU-only.
  # GGML_NATIVE=OFF is not a performance choice, it is a correctness one. With it on, ggml compiles
  # for whatever CPU the runner happens to have -- and ccache is keyed by OS, not by runner
  # generation, so an object built on a machine with AVX-512 gets reused on one without it and the
  # process dies with SIGILL inside llama_backend_init, before a line of test code runs. ci-windows
  # got this right from the start (S1-33); ci-cpu did not, and it surfaced as a random illegal
  # instruction the moment a source change reshuffled which objects were cache hits.
  #
  # It is also what ADR-0002's determinism story rests on: an oracle that is compiled differently on
  # different days is not an oracle.
  CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF"

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-cpu-${{ matrix.os }}
          max-size: 500M

      - name: Install build tooling
        run: pip install scikit-build-core cmake ninja build

      # VERIFY, and do not apply -- the step name was already saying so while the script it ran was
      # doing a real `git am`. The distinction is not pedantic. This is the only job in the repo
      # that builds a wheel; `test`, `ops`, ci-windows and ci-metal all build the pin exactly as
      # checked out. So a non-empty queue applied HERE would ship a wheel whose vendor tree no other
      # job in the matrix tested, and would bake a submodule commit created seconds earlier on this
      # runner -- a hash that exists on no remote -- into farm_version.h and _version_lock.py, i.e.
      # into the very version lock whose job is to make that kind of divergence detectable.
      #
      # Applying the queue stays a deliberate local/fork step (patches/README.md). CI's contract is
      # narrower and honest: the queue still applies to the pinned HEAD.
      - name: Verify the patch queue applies
        run: ./scripts/apply-patches.sh --check

      - name: Build the wheel
        run: python -m build --wheel --no-isolation

      # Install the wheel and import it from OUTSIDE the source tree. The `cd` is the entire point:
      # every other lane runs against an editable install, which resolves the package out of `src/`
      # -- so any file the wheel fails to ship is still right there on the path, and the lane stays
      # green. That is not hypothetical. It shipped: `_version_lock.py` is generated by CMake into
      # the source tree and gitignored, scikit-build-core honours gitignore when packing, and so
      # every wheel this project ever built raised ModuleNotFoundError on first import. Nothing
      # noticed, because nothing had ever installed one (S1-33).
      #
      # Installed WITH its dependencies, and exercised through the PUBLIC api -- not `_ffi`. Both
      # details are load-bearing. `pip install --no-deps` plus a private import is a weaker test
      # than it looks: it proves the shared libraries shipped, and nothing about whether a stranger
      # can use the package. It passed for as long as `import learning_llamas` bound no names, and
      # went on passing while four modules imported `gguf` -- which was not a declared dependency
      # (S1-35).
      - name: The wheel installs and imports
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "
          import learning_llamas
          learning_llamas.libraries()
          print('the wheel imports:', len(learning_llamas.__all__), 'public names')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  test:
    name: test
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-cpu-${{ matrix.os }}
          max-size: 500M

      - name: Install
        run: |
          pip install scikit-build-core cmake ninja pytest
          pip install -e . --no-build-isolation
          # gguf-py comes from the vendored tree, never PyPI: the pinned llama.cpp commit,
          # gguf-py, and the _ffi struct mirrors are one atomic version (ADR-0001).
          pip install -e vendor/llama.cpp/gguf-py

      - name: pytest (per-PR selection)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pytest tests/ -m "not slow" -v

      - name: pytest (full suite, incl. slow)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest tests/ -v

  ops:
    name: ops
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-cpu-ops-${{ matrix.os }}
          max-size: 500M

      # GGML_NATIVE=OFF here too, and it matters MORE here than anywhere else.
      #
      # This job is the correctness ORACLE (ADR-0002): every GPU kernel is later accepted by
      # matching what this CPU build produces. An oracle that is compiled differently on different
      # days is not an oracle. With GGML_NATIVE on, ggml builds for whatever runner it lands on, so
      # a finite-difference check sitting near its tolerance passes on AVX2 and fails on AVX-512 --
      # because the accumulation order changed, not because the gradient did.
      #
      # That is not hypothetical: SOFT_MAX's grad check (MAA 0.0197 vs a 0.005 tolerance) failed on
      # one runner and passed on another, on identical ggml. The env-level CMAKE_ARGS does not reach
      # this step, because scikit-build-core reads it and raw cmake does not.
      - name: Build test-backend-ops
        run: |
          cmake -S vendor/llama.cpp -B build/vendor-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/vendor-tests --target test-backend-ops -j 4

      # Per-PR: a targeted subset, chosen for the ops the training path actually depends
      # on. MUL_MAT and OUT_PROD are the backward core (every MUL_MAT gradient goes
      # through OUT_PROD); SOFT_MAX and RMS_NORM are the two normalizations in the graph;
      # CROSS_ENTROPY_LOSS is the loss S1-04 replaces with a sparse variant. Adding an op
      # here is cheap; adding the FULL sweep to the per-PR lane is not, which is why it is
      # nightly.
      - name: test-backend-ops — test (targeted, CPU)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          ./build/vendor-tests/bin/test-backend-ops test -b CPU \
            -o MUL_MAT,OUT_PROD,SOFT_MAX,RMS_NORM,CROSS_ENTROPY_LOSS

      # MODE_GRAD is the acceptance harness for every kernel ticket (ADR-0002). Running it
      # per-PR from day one protects the CPU oracle that stages 2-4 are measured against.
      #
      # The op list is NO LONGER WRITTEN HERE. It is tests/project_ops.py, and this job reads
      # it -- because when it lived inline it went stale the moment a kernel ticket landed. By
      # S1-31 it still named eight ops and the project had thirteen: MUL_MAT_ID, ADD_ID, GLU,
      # SSM_CONV and SSM_SCAN -- every op the MoE and Mamba work added -- were not being
      # grad-checked in CI at all, and CI was green.
      #
      # tests/test_backend_ops_grad.py owns the per-op run AND the vacuity guard: an op whose
      # test class never calls ggml_set_param reports OK having checked nothing, so a green
      # `grad -o X` is not evidence that X has a backward. See docs/dev/backward-coverage.md.
      - name: Install (for the grad wrapper)
        run: |
          pip install scikit-build-core cmake ninja pytest
          pip install -e . --no-build-isolation
          pip install -e vendor/llama.cpp/gguf-py

      - name: test-backend-ops — grad (MODE_GRAD, ops from tests/project_ops.py)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          TEST_BACKEND_OPS: ${{ github.workspace }}/build/vendor-tests/bin/test-backend-ops
          # Deterministic MODE_GRAD draws (S1-50): the SSM scan's FD is the worst-conditioned
          # in the suite, and an unseeded run makes a marginal draw unreproducible.
          GGML_TEST_SEED: "20260716"
        run: pytest tests/test_backend_ops_grad.py -v

      - name: test-backend-ops — full sweep (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TEST_BACKEND_OPS: ${{ github.workspace }}/build/vendor-tests/bin/test-backend-ops
          # Deterministic MODE_GRAD draws (S1-50): the SSM scan's FD is the worst-conditioned
          # in the suite, and an unseeded run makes a marginal draw unreproducible.
          GGML_TEST_SEED: "20260716"
        run: |
          ./build/vendor-tests/bin/test-backend-ops test -b CPU
          pytest tests/test_backend_ops_grad.py -v
          # MUL_MAT is nightly-only: it takes 3m20s, and it is the ONLY thing that exercises
          # OUT_PROD's gradient path at all (MUL_MAT's backward is built from ggml_out_prod,
          # ggml.c:6594-6630, while `grad -o OUT_PROD` checks zero gradients -- test_out_prod
          # never calls ggml_set_param).
          #
          # The UNFILTERED grad sweep, which ADR-0001 wants on every vendor bump, still cannot
          # complete -- it aborts on ops that have no backward rule (CUMSUM, DIAG, FILL, ...,
          # ggml.c:6906). None is on a training path. See docs/dev/backward-coverage.md.
          ./build/vendor-tests/bin/test-backend-ops grad -b CPU -o MUL_MAT

  # Regenerate tests/convergence/reference_curve.json (S1-12). Run BY HAND, and only when the
  # gate says the recorded curve describes a different experiment -- it embeds an identity hash
  # over the fixture generator, the config and the dataset, so it fails loudly rather than
  # comparing against a curve for something else.
  #
  # torch and peft are NOT dependencies of this project and must not become any. They exist only
  # inside this job. The recorder needs no compiled shim -- it builds an F32 fixture and a zero
  # adapter, both pure gguf-py -- so the source on PYTHONPATH is enough.
  record-reference:
    name: record-reference (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.record_reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the recording environment
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install peft transformers
          pip install -e vendor/llama.cpp/gguf-py

      - name: Record
        run: PYTHONPATH=$PWD:$PWD/src python -m tests.convergence.record_reference

      - name: Show the diff
        run: git diff --stat tests/convergence/reference_curve.json

      - uses: actions/upload-artifact@v4
        with:
          name: reference_curve
          path: tests/convergence/reference_curve.json

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pre-commit
      # vendor/ is excluded in .pre-commit-config.yaml, so this needs no submodule.
      - run: pre-commit run --all-files --show-diff-on-failure
